plugins {
    id 'com.android.application'
}

android {
    namespace 'uz.pomodoro.flip'
    compileSdk 34

    defaultConfig {
        applicationId 'uz.pomodoro.flip'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Oddiy o'rnatish uchun release ham debug kaliti bilan imzolanadi
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
